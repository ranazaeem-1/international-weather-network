<!doctype html>
<html><head><meta charset="utf-8"><title>Carver card: chart</title>
<link rel="stylesheet" href="../../brand-kit/src/brand.css"><link rel="stylesheet" href="card.css"><script src="card.js"></script>
</head><body><div class="stage" id="stage"></div>
<script>
// chart card: line (draws left to right) or bar (grows in sequence) series, axes, threshold lines, end-point notes, source line.
CW.boot(async (S, stage) => {
  const { el, svgEl, esc, color, tween, loop, enter, E, lerp, clamp, fmt } = CW;
  if (S.bg_image) await CW.loadImg(S.bg_image);
  CW.background(S, stage);
  CW.title(S.title, stage);
  const X0 = S.plot?.x0 ?? 200, X1 = S.plot?.x1 ?? 1780, Y0 = S.plot?.y0 ?? 520, Y1 = S.plot?.y1 ?? (S.strap_clear ? 730 : 870);
  const kind = S.chart || "line", series = S.series || [], ys = S.y || {}, xs = S.x || {};
  const svg = svgEl("svg", { class: "plot", width: 1920, height: 1080, viewBox: "0 0 1920 1080" }, stage);
  const defs = svgEl("defs", {}, svg);
  // ---- scales ----
  const nice = x => { const p = Math.pow(10, Math.floor(Math.log10(x))); for (const m of [1, 2, 2.5, 5, 10]) if (m * p >= x) return m * p; return 10 * p; };
  const allY = series.flatMap(s => s.points ? s.points.map(p => p[1]) : (s.values || [])).concat((S.thresholds || []).map(t => t.value));
  let ymin = ys.min ?? Math.min(0, ...allY), ymaxRaw = ys.max ?? Math.max(...allY) * 1.12;
  const step = ys.step ?? nice((ymaxRaw - ymin) / 5), ymax = ys.max ?? Math.ceil(ymaxRaw / step) * step;
  const ydec = ys.decimals ?? CW.decimalsOf(step);
  const sy = v => Y1 - (v - ymin) / (ymax - ymin) * (Y1 - Y0);
  const cats = xs.labels || null, numeric = !cats;
  const allX = numeric ? series.flatMap(s => (s.points || []).map(p => p[0])) : [];
  const xmin = xs.min ?? (numeric ? Math.min(...allX) : 0), xmax = xs.max ?? (numeric ? Math.max(...allX) : 0);
  const n = cats ? cats.length : 0, slot = n ? (X1 - X0) / n : 0;
  const sx = numeric ? (x => X0 + (x - xmin) / (xmax - xmin) * (X1 - X0)) : (kind === "bar" ? (i => X0 + slot * (i + .5)) : (i => X0 + i / Math.max(1, n - 1) * (X1 - X0)));
  // ---- axes / grid ----
  const ga = svgEl("g", {}, svg);
  for (let v = ymin; v <= ymax + 1e-9; v += step) {
    const y = sy(v);
    svgEl("line", { x1: X0, x2: X1, y1: y, y2: y, stroke: Math.abs(v - ymin) < 1e-9 ? "rgba(255,255,255,.45)" : "rgba(255,255,255,.10)", "stroke-width": Math.abs(v - ymin) < 1e-9 ? 2 : 1.5 }, ga);
    svgEl("text", { x: X0 - 20, y: y + 9, "text-anchor": "end", fill: CW.PAL.steel, "font-size": 27, "font-weight": 600 }, ga).textContent = fmt(v, ydec);
  }
  if (ys.unit) svgEl("text", { x: X0 - 20, y: Y0 - 30, "text-anchor": "end", fill: CW.PAL.paper, "font-size": 24, "font-weight": 700, "letter-spacing": "2.5" }, ga).textContent = ys.unit;
  const xt = numeric ? (xs.ticks || []) : cats.map((l, i) => ({ v: i, label: l }));
  xt.forEach(tk => {
    const x = sx(tk.v), lines = String(tk.label).split("\n");
    if (numeric) svgEl("line", { x1: x, x2: x, y1: Y1, y2: Y1 + 10, stroke: "rgba(255,255,255,.45)", "stroke-width": 2 }, ga);
    const tx = svgEl("text", { x, y: Y1 + 40, "text-anchor": "middle", fill: CW.PAL.steel, "font-size": 25, "font-weight": 600, "letter-spacing": "1.5" }, ga);
    lines.forEach((l, j) => { const ts = svgEl("tspan", { x, dy: j ? 27 : 0 }, tx); ts.textContent = l; if (j) ts.setAttribute("fill", "rgba(147,163,191,.75)"); });
  });
  tween(.25, .6, q => ga.setAttribute("opacity", q));
  // ---- threshold lines ----
  (S.thresholds || []).forEach((th, i) => {
    const y = sy(th.value), col = color(th.color || th.kind, "crimson"), at = th.at ?? (.55 + .12 * i);
    const ln = svgEl("line", { x1: X0, x2: X0, y1: y, y2: y, stroke: col, "stroke-width": 3, "stroke-dasharray": "14 9" }, svg);
    tween(at, .7, q => ln.setAttribute("x2", lerp(X0, X1, q)), E.inout);
    if (th.label) {
      const lb = el("div", "thr zc", esc(th.label), stage);
      lb.style.background = col; lb.style.color = CW.darkText(col) ? CW.PAL.ink : "#fff";
      const r = lb.getBoundingClientRect();
      lb.style.left = (X1 - r.width) + "px"; lb.style.top = (y - r.height - 8) + "px";
      enter(lb, at + .35, { y: 8, dur: .45 });
    }
  });
  // ---- series ----
  const palette = ["sky", "amber", "white", "crimson"];
  const ends = [];
  series.forEach((s, si) => {
    const col = color(s.color || palette[si % 4]), at = s.at ?? (.7 + .3 * si), dr = s.draw ?? (kind === "bar" ? .6 : 2.2);
    if (kind === "bar") {
      const vals = s.values || [], bw = slot * (s.bar_width ?? .58) / Math.max(1, series.length), stag = s.stagger ?? .12;
      vals.forEach((v, i) => {
        const x = X0 + slot * i + (slot - bw * series.length) / 2 + bw * si, hiCol = (s.highlight || []).includes(i) ? color(s.highlight_color || "crimson") : col;
        const r = svgEl("rect", { x, width: bw - 6, y: Y1, height: 0, fill: hiCol }, svg);
        const vt = svgEl("text", { x: x + (bw - 6) / 2, y: Y1 - 14, "text-anchor": "middle", fill: "#fff", "font-size": 34, "font-weight": 800, opacity: 0 }, svg);
        const dec = s.decimals ?? CW.decimalsOf(v), t0 = (s.ats && s.ats[i] != null) ? s.ats[i] : at + stag * i;
        tween(t0, dr, q => { const top = lerp(Y1, sy(v), q); r.setAttribute("y", top); r.setAttribute("height", Y1 - top);
          vt.setAttribute("y", top - 14); vt.setAttribute("opacity", Math.min(1, q * 2.5)); vt.textContent = fmt(v * q, dec); });
        ends.push({ si, i, x: x + (bw - 6) / 2, y: sy(v), at: t0 + dr });
      });
      return;
    }
    const raw = s.points ? s.points : (s.values || []).map((v, i) => [i, v]);
    const pts = raw.map(([x, y]) => [sx(x), sy(y)]);
    const id = "clip" + si, cp = svgEl("clipPath", { id }, defs), rect = svgEl("rect", { x: X0 - 20, y: 0, width: 0, height: 1080 }, cp);
    const g = svgEl("g", { "clip-path": `url(#${id})` }, svg);
    const d = "M" + pts.map(p => p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" L");
    if (s.area !== false) {
      const gid = "ag" + si, lg = svgEl("linearGradient", { id: gid, x1: 0, y1: 0, x2: 0, y2: 1 }, defs);
      svgEl("stop", { offset: 0, "stop-color": col, "stop-opacity": .34 }, lg); svgEl("stop", { offset: 1, "stop-color": col, "stop-opacity": 0 }, lg);
      svgEl("path", { d: d + ` L${pts[pts.length - 1][0].toFixed(1)} ${Y1} L${pts[0][0].toFixed(1)} ${Y1} Z`, fill: `url(#${gid})` }, g);
    }
    svgEl("path", { d, fill: "none", stroke: col, "stroke-width": s.width ?? 6, "stroke-linejoin": "round", "stroke-linecap": "round" }, g);
    const head = svgEl("circle", { r: 9, fill: "#fff", stroke: col, "stroke-width": 5, opacity: 0 }, svg);
    const yAt = x => { for (let i = 0; i < pts.length - 1; i++) if (x <= pts[i + 1][0]) { const a = pts[i], b = pts[i + 1]; return lerp(a[1], b[1], clamp((x - a[0]) / Math.max(1e-6, b[0] - a[0]))); } return pts[pts.length - 1][1]; };
    const xa = pts[0][0], xb = pts[pts.length - 1][0];
    tween(at, dr, q => { const x = lerp(xa, xb, q); rect.setAttribute("width", Math.max(0, x - X0 + 20 + (q >= 1 ? 40 : 0)));
      head.setAttribute("cx", x); head.setAttribute("cy", yAt(x)); head.setAttribute("opacity", q > 0 && q < 1 ? 1 : 0); }, E.inout);
    s._pts = pts; s._at = at; s._dr = dr;
  });
  // ---- end-point annotations ----
  (S.annotations || []).forEach((an, ai) => {
    let px, py, at0;
    if (kind === "bar") { const e = ends.filter(e => e.si === (an.series ?? 0)); const k = an.index ?? e.length - 1; const e0 = e[k < 0 ? e.length + k : k]; px = e0.x; py = e0.y - 50; at0 = e0.at; }
    else {
      const s = series[an.series ?? 0], P = s._pts, R = s.points || (s.values || []).map((v, i) => [i, v]);
      let k = an.index ?? P.length - 1;
      if (an.point === "max") k = R.reduce((b, p, i) => p[1] > R[b][1] ? i : b, 0);
      if (an.point === "min") k = R.reduce((b, p, i) => p[1] < R[b][1] ? i : b, 0);
      if (k < 0) k = P.length + k;
      [px, py] = P[k]; at0 = s._at + s._dr * (P.length > 1 ? (P[k][0] - P[0][0]) / (P[P.length - 1][0] - P[0][0]) : 1);
      const dot = svgEl("circle", { cx: px, cy: py, r: 11, fill: CW.PAL.ink, stroke: "#fff", "stroke-width": 5, opacity: 0 }, svg);
      tween(an.at ?? at0, .35, q => { dot.setAttribute("opacity", q); dot.setAttribute("r", lerp(4, 11, q)); });
    }
    const at = an.at ?? at0 + .15;
    const box = el("div", "ann zc", `<b>${esc(an.text)}</b>${an.sub ? `<i>${esc(an.sub)}</i>` : ""}`, stage);
    if (an.color) box.style.borderTopColor = color(an.color);
    const r = box.getBoundingClientRect();
    let left = an.side === "right" || (an.side !== "left" && px < (X0 + X1) / 2) ? px + 28 : px - r.width - 28;
    left = clamp(left, 60, 1860 - r.width);
    let top = py - r.height - 30;
    const minTop = left + r.width > 1130 ? 500 : 140;
    if (top < minTop) top = Math.min(py + 30, Y1 - r.height - 10) < minTop ? minTop : py + 30;
    box.style.left = left + "px"; box.style.top = top + "px";
    enter(box, at, { y: 12, dur: .5 });
  });
  // ---- series legend (2+ series) and the data source line ----
  if (series.length > 1 && kind === "line") {
    const sl = el("div", "slegend zc", series.map((s, i) => `<div><span style="background:${color(s.color || palette[i % 4])}"></span>${esc(s.name || "")}</div>`).join(""), stage);
    sl.style.left = X0 + "px"; sl.style.top = (Y0 - 52) + "px"; enter(sl, .6, { y: 8 });
  }
  if (S.source) { const src = el("div", "srcline zc", esc(S.source), stage); src.style.top = (Y1 + (numeric && xt.some(t => String(t.label).includes("\n")) ? 86 : 64)) + "px"; enter(src, .9, { y: 8 }); }
});
</script></body></html>
